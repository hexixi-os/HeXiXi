name: Build Kernel

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly-2022-08-05
        with:
          components: rust-src, llvm-tools-preview
          targets: riscv64gc-unknown-none-elf
      - name: Check RISC-V64 single-core & SMP
        run: |
          cd user && cargo build --release --bin oscomp_runner
          cd ../os && cp src/linker-qemu.ld src/linker.ld
          cargo build --release --features "board_qemu oscomp_runner"
          cargo build --release --features "board_qemu oscomp_runner smp"
          rm -f src/linker.ld
